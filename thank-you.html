<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Sent | Salman Khan</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        *{ margin:0; padding:0; box-sizing:border-box; font-family: Arial, Helvetica, sans-serif; }
        body{
            background:#000;
            color:#fff;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            text-align:center;
            padding:20px;
        }
        .card{
            max-width:480px;
        }
        .check{
            width:80px;
            height:80px;
            border-radius:50%;
            background:rgba(228,100,0,0.12);
            border:2px solid #E46400;
            display:flex;
            align-items:center;
            justify-content:center;
            margin:0 auto 25px;
        }
        .check i{
            font-size:40px;
            color:#E46400;
        }
        h1{
            font-size:32px;
            margin-bottom:14px;
        }
        h1 span{
            color:#E46400;
        }
        p{
            color:#ccc;
            line-height:1.7;
            margin-bottom:30px;
        }
        a.btn-box{
            display:inline-block;
            padding:12px 28px;
            background:#E46400;
            color:#081b29;
            font-size:16px;
            font-weight:600;
            text-decoration:none;
            border-radius:40px;
            letter-spacing:1px;
            box-shadow:0 0 15px #E46400;
            transition:.3s;
        }
        a.btn-box:hover{
            transform:scale(1.05);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="check"><i class='bx bx-check'></i></div>
        <h1>Message <span>Sent!</span></h1>
        <p>Thanks for reaching out — I've received your message and will get back to you as soon as possible.</p>
        <a href="index.html#home" class="btn-box">Back to Portfolio</a>
    </div>
</body>
</html>
